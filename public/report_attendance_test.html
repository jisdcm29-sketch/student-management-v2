<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>학생관리시스템 V2 - 통합 출석 조회 테스트</title>
  <style>
    :root{--primary:#1f4b70;--border:#dbe3ee;--muted:#667085;--bg:#f4f7fb;--good:#176b3a;--warn:#9a5a00;--bad:#a92820}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#1f2937;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-size:15px;line-height:1.5}
    .wrap{max-width:1500px;margin:0 auto;padding:24px}
    .panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(15,23,42,.04)}
    h1,h2,h3{margin:0 0 12px;color:#153f63} h1{font-size:25px} h2{font-size:20px}
    .muted{color:var(--muted);font-size:13px}
    .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) 160px 160px auto;gap:12px;align-items:end}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#34495e}
    select,input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit}
    button{border:0;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--primary);color:#fff;white-space:nowrap}
    button.secondary{background:#475569}.actions{display:flex;gap:8px;align-items:center}
    .status{margin-top:12px;padding:10px 12px;border-radius:9px;background:#f8fafc;color:#5f6f80;font-size:13px}.status.error{background:#fff1f0;color:#b42318}.status.ok{background:#eef9f2;color:#176b3a}
    .student-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
    .student-name{font-size:25px;font-weight:800;color:#153f63}.student-meta{margin-top:4px;color:#65758a}
    .summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:12px;margin-top:16px}
    .card{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fbfdff}.card .k{font-size:12px;color:#708196;font-weight:700}.card .v{font-size:25px;font-weight:800;color:#153f63;margin-top:5px}
    .table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 11px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.table th{background:#f8fafc;color:#153f63}.table td.memo{white-space:normal;min-width:260px}
    .pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#eef2f7;color:#425466}.pill.legacy{background:#fff4e6;color:#8a5700}.pill.current{background:#eaf2ff;color:#24558f}
    .present{color:var(--good);font-weight:800}.late{color:var(--warn);font-weight:800}.absent{color:var(--bad);font-weight:800}.early{color:#24558f;font-weight:800}
    .hidden{display:none!important}
    @media(max-width:1000px){.toolbar{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(2,1fr)}}
    @media print{body{background:#fff}.wrap{max-width:none;padding:0}.panel{box-shadow:none;border:0;padding:0}.toolbar,.status,.no-print{display:none!important}.table th,.table td{font-size:11px;padding:6px}.summary{grid-template-columns:repeat(5,1fr);gap:6px}.card{padding:8px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>통합 출석 조회 테스트</h1>
      <p class="muted">현재 V2 Attendance와 이전 학생관리 LegacyAttendanceHistory를 학생별로 합쳐 조회합니다. 같은 학생·같은 날짜는 현재 V2 기록을 우선합니다.</p>
      <div class="toolbar" style="margin-top:16px">
        <div><label for="classId">반</label><select id="classId"><option value="">전체 반</option></select></div>
        <div><label for="studentId">학생</label><select id="studentId"><option value="">학생 선택</option></select></div>
        <div><label for="startDate">시작일</label><input id="startDate" type="date"></div>
        <div><label for="endDate">종료일</label><input id="endDate" type="date"></div>
        <div class="actions"><button id="loadBtn" type="button">조회</button><button id="printBtn" class="secondary" type="button">인쇄</button></div>
      </div>
      <div id="status" class="status">메인 프로그램에서 로그인한 뒤 같은 탭에서 이 페이지를 열어 주세요.</div>
    </section>

    <section id="resultPanel" class="panel hidden">
      <div class="student-head">
        <div><div id="studentName" class="student-name">-</div><div id="studentMeta" class="student-meta"></div></div>
        <div class="muted">현재 출석 + 이전 출석 통합</div>
      </div>
      <div class="summary">
        <div class="card"><div class="k">총 수업일</div><div id="sumTotal" class="v">0</div></div>
        <div class="card"><div class="k">출석</div><div id="sumPresent" class="v">0</div></div>
        <div class="card"><div class="k">지각</div><div id="sumLate" class="v">0</div></div>
        <div class="card"><div class="k">결석</div><div id="sumAbsent" class="v">0</div></div>
        <div class="card"><div class="k">조퇴</div><div id="sumEarly" class="v">0</div></div>
      </div>
    </section>

    <section id="tablePanel" class="panel hidden">
      <h2>출석 이력</h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>날짜</th><th>상태</th><th>반</th><th>출처</th><th>메모</th></tr></thead>
          <tbody id="rowsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module">
    import { listClasses, listStudents, getStudentAttendanceHistory } from '../src/api/api-client.js';

    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    const token=sessionStorage.getItem('v2SessionToken')||'';
    let classes=[]; let students=[];

    function setStatus(message,type=''){
      $('status').textContent=message;
      $('status').className='status'+(type?' '+type:'');
    }
    function statusClass(status){
      return status==='출석'?'present':status==='지각'?'late':status==='결석'?'absent':status==='조퇴'?'early':'';
    }
    function fillStudents(){
      const classId=$('classId').value;
      const old=$('studentId').value;
      const rows=students.filter(s=>!classId||String(s.classId||'')===classId).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));
      $('studentId').innerHTML='<option value="">학생 선택</option>'+rows.map(s=>'<option value="'+esc(s.studentId)+'">'+esc(s.name||s.studentId)+' ('+esc(s.studentId)+')</option>').join('');
      if(old&&rows.some(s=>String(s.studentId)===old))$('studentId').value=old;
    }
    async function init(){
      if(!token){setStatus('로그인 세션이 없습니다. 메인 프로그램에서 로그인한 뒤 같은 탭에서 이 페이지를 열어 주세요.','error');return;}
      setStatus('반·학생 목록을 불러오는 중입니다...');
      try{
        const [c,s]=await Promise.all([listClasses(token,{}),listStudents(token,{currentOnly:true})]);
        classes=Array.isArray(c.classes)?c.classes:[];
        students=Array.isArray(s.students)?s.students:[];
        $('classId').innerHTML='<option value="">전체 반</option>'+classes.filter(x=>String(x.status||'')!=='종료').map(x=>'<option value="'+esc(x.classId)+'">'+esc(x.className||x.classId)+' ('+esc(x.classId)+')</option>').join('');
        fillStudents();
        setStatus('조회할 학생을 선택해 주세요.','ok');
      }catch(e){setStatus('초기화 오류: '+e.message+(e.code?' ['+e.code+']':''),'error');}
    }
    async function loadReport(){
      const studentId=$('studentId').value;
      if(!studentId){setStatus('학생을 선택해 주세요.','error');return;}
      const options={};
      if($('startDate').value)options.startDate=$('startDate').value;
      if($('endDate').value)options.endDate=$('endDate').value;
      setStatus('출석 이력을 불러오는 중입니다...');
      try{
        const data=await getStudentAttendanceHistory(token,studentId,options);
        const st=data.student||{}, sum=data.summary||{}, rows=Array.isArray(data.rows)?data.rows:[];
        $('studentName').textContent=st.name||st.studentId||'-';
        $('studentMeta').textContent=[st.studentId,st.classId,st.phone,st.status].filter(Boolean).join(' · ');
        $('sumTotal').textContent=sum.total??0;
        $('sumPresent').textContent=sum.present??0;
        $('sumLate').textContent=sum.late??0;
        $('sumAbsent').textContent=sum.absent??0;
        $('sumEarly').textContent=sum.early??0;
        $('rowsBody').innerHTML=rows.length?rows.map(r=>{
          const src=String(r.source||'');
          const srcLabel=r.sourceLabel||(src==='CURRENT'?'현재 V2':'이전 학생관리');
          return '<tr>'+ 
            '<td>'+esc(r.date||'')+'</td>'+ 
            '<td class="'+statusClass(r.status)+'">'+esc(r.status||'-')+'</td>'+ 
            '<td>'+esc(r.currentClassId||r.classId||r.sourceClassId||'-')+'</td>'+ 
            '<td><span class="pill '+(src==='CURRENT'?'current':'legacy')+'">'+esc(srcLabel)+'</span></td>'+ 
            '<td class="memo">'+esc(r.memo||'')+'</td>'+ 
          '</tr>';
        }).join(''):'<tr><td colspan="5" style="text-align:center;color:#667085;padding:20px">조회 기간에 출석 기록이 없습니다.</td></tr>';
        $('resultPanel').classList.remove('hidden');
        $('tablePanel').classList.remove('hidden');
        setStatus('출석 이력을 불러왔습니다.','ok');
      }catch(e){
        $('resultPanel').classList.add('hidden');$('tablePanel').classList.add('hidden');
        setStatus('조회 오류: '+e.message+(e.code?' ['+e.code+']':''),'error');
      }
    }
    $('classId').addEventListener('change',fillStudents);
    $('loadBtn').addEventListener('click',loadReport);
    $('printBtn').addEventListener('click',()=>window.print());
    init();
  </script>
</body>
</html>
